<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kora</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-app-region: drag;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    /* Ambient glow behind logo */
    .glow {
      position: absolute;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.35) 0%, rgba(124, 58, 237, 0) 70%);
      filter: blur(20px);
      z-index: 0;
      animation: pulse-glow 2.5s ease-in-out infinite alternate;
    }

    .logo-wrapper {
      position: relative;
      z-index: 1;
      width: 96px;
      height: 96px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.6);
      animation: float-logo 3s ease-in-out infinite alternate;
    }

    .logo-img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      border-radius: 12px;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      z-index: 1;
    }

    .brand-tagline {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #8b5cf6;
      margin-bottom: 24px;
      z-index: 1;
    }

    .loader {
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 1;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #8b5cf6;
      opacity: 0.4;
      animation: dot-pulse 1.4s ease-in-out infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse-glow {
      0% { opacity: 0.5; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.15); }
    }

    @keyframes float-logo {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-4px); }
    }

    @keyframes dot-pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.3); background-color: #a78bfa; }
    }
  </style>
</head>
