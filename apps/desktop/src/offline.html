<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kora - Offline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 20px;
      padding: 36px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    .icon-box {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: #f87171;
    }

    h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p {
      color: #a1a1aa;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .status-text {
      font-size: 12px;
      color: #71717a;
      margin-bottom: 20px;
    }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: #7c3aed;
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-retry:hover {
      background: #6d28d9;
      transform: translateY(-1px);
    }

    .btn-retry:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <h2>Unable to reach Kora</h2>
    <p>We couldn't establish a secure connection to the server. Please check your internet connection.</p>
    <div class="status-text" id="status">Checking for connection...</div>

    <button class="btn-retry" onclick="retryConnection()">Retry Now</button>
  </div>

  <script>
    function retryConnection() {
      document.getElementById('status').innerText = 'Reconnecting...';
      if (window.koraBridge && window.koraBridge.reloadApp) {
        window.koraBridge.reloadApp();
      } else {
        window.location.reload();
      }
    }

    // Auto-reconnect when connection recovers
    window.addEventListener('online', () => {
      document.getElementById('status').innerText = 'Connection detected! Reloading...';
      setTimeout(retryConnection, 1000);
    });

    setInterval(() => {
      if (navigator.onLine) {
        retryConnection();
      }
    }, 5000);
  </script>
</body>
</html>
