name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: schoolos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/schoolos_test?schema=public"
      DIRECT_URL: "postgresql://postgres:password@localhost:5432/schoolos_test?schema=public"
      AUTH_SECRET: "test-secret-value-32-chars-long-at-least"
      NEXTAUTH_URL: "http://localhost:3000"
      UPSTASH_REDIS_REST_URL: "https://fake.upstash.io"
      UPSTASH_REDIS_REST_TOKEN: "fake-token"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run db:generate

      - name: Push Schema to Test Database
        run: pnpm --filter @schoolos/db run db:push --accept-data-loss

      - name: Run Type Checking
        run: pnpm run type-check

      - name: Run Linter
        run: pnpm run lint

      - name: Run Test Suite
        run: pnpm --filter @schoolos/admin-web run test
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/schoolos_test?schema=public"

      - name: Run Production Build
        run: pnpm run build
        env:
          NODE_ENV: production
