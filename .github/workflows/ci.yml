name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/schoolos' }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'test-secret-value-32-chars-long-at-least' }}
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run db:generate

      - name: Run Type Checking
        run: pnpm run type-check

      - name: Run Linter
        run: pnpm run lint

      - name: Run Test Suite
        run: pnpm --filter @schoolos/admin-web run test
        env:
          NODE_ENV: test

      - name: Run Production Build
        run: pnpm run build
